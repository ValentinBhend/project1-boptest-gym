[project]
name = "boptest-gym"
version = "0.8.0"
description = "Gymnasium environment for the BOPTEST building emulator framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.28",
    "stable-baselines3>=2.0",
    "requests",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
]

[project.urls]
Homepage = "https://github.com/ibpsa/project1-boptest-gym"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# boptestGymEnv imports examples.test_and_plot at import time, so both ship
only-include = ["boptestGymEnv.py", "examples"]
